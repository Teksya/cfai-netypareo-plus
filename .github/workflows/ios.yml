# Construit une IPA non signée, à installer avec AltStore ou Sideloadly (signature avec ton identifiant Apple).
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main, ios-support]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - name: Empaqueter l'IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr netypareo_plus.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: netypareo_plus-ios
          path: netypareo_plus.ipa
